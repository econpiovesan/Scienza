<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Corso interattivo sul metodo scientifico, Marco Piovesan">
  <meta name="theme-color" content="#13233f">
  <title>Pensare come uno scienziato</title>
  <style>
:root {
  --ink: #13233f;
  --ink-soft: #34445e;
  --paper: #f5f0e7;
  --surface: #fffdf8;
  --surface-2: #eee8dd;
  --line: #ddd5c7;
  --blue: #275df5;
  --cyan: #2ac6c8;
  --coral: #ff705f;
  --lime: #b9da4b;
  --gold: #f2c555;
  --green: #16896c;
  --red: #c84e41;
  --sidebar: 290px;
  --radius: 22px;
  --shadow: 0 18px 55px rgba(19, 35, 63, .12);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
.shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); }

.sidebar { height: 100vh; position: sticky; top: 0; z-index: 40; overflow-y: auto; padding: 28px 20px 20px; color: #fff; background: var(--ink); }
.brand { display: flex; gap: 13px; align-items: center; margin: 0 8px 26px; color: #fff; text-decoration: none; }
.brand-symbol { width: 44px; height: 44px; display: grid; place-items: center; flex: none; border-radius: 14px; background: var(--coral); box-shadow: 5px 5px 0 var(--cyan); font-size: 24px; transform: rotate(-4deg); }
.brand strong { display: block; font-size: 15px; line-height: 1.12; }
.brand small { display: block; margin-top: 5px; color: #91a2bf; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
.main-nav { display: grid; gap: 3px; }
.nav-item, .chapter-link { width: 100%; border: 0; border-radius: 12px; background: transparent; color: #dbe3f0; text-align: left; transition: .18s ease; }
.nav-item { padding: 10px 12px; display: flex; gap: 11px; align-items: center; font-size: 13px; }
.nav-item > span { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; background: #2a4268; font-size: 11px; font-weight: 800; }
.nav-item:hover, .chapter-link:hover { background: #203657; }
.nav-item.active, .chapter-link.active { background: #fff; color: var(--ink); font-weight: 800; }
.nav-item.active > span { background: var(--cyan); }
.part-label { margin: 22px 10px 7px; color: #8599b9; font-size: 9px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
.chapter-link { padding: 9px 10px; display: flex; gap: 10px; align-items: flex-start; }
.chapter-number { width: 24px; height: 24px; display: grid; place-items: center; flex: none; border: 1px solid #4c6080; border-radius: 50%; font-size: 10px; font-weight: 850; }
.chapter-link.done .chapter-number { border-color: var(--cyan); background: var(--cyan); color: #073d46; }
.chapter-link span:last-child { padding-top: 3px; font-size: 11px; line-height: 1.25; }
.sidebar-progress { margin: 24px 8px 4px; padding: 15px; border-radius: 16px; background: #1d3152; }
.sidebar-progress > div:first-child { display: flex; justify-content: space-between; margin-bottom: 9px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.sidebar-progress strong { color: var(--lime); }
.progress-track { height: 7px; overflow: hidden; border-radius: 999px; background: #354b70; }
.progress-track i { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--cyan), var(--lime)); transition: width .5s ease; }

.main { min-width: 0; }
.topbar { height: 78px; padding: 0 5vw; position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(19,35,63,.09); background: rgba(245,240,231,.91); backdrop-filter: blur(14px); }
.breadcrumb { color: #657087; font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
.top-actions { display: flex; align-items: center; gap: 9px; }
.icon-button { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); color: var(--ink); }
.menu-button { display: none; }
.search-button { min-width: 210px; padding: 8px 10px; display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); color: #737d90; text-align: left; }
.search-button .search-label { flex: 1; }
kbd { padding: 2px 6px; border: 1px solid #d7d0c5; border-radius: 6px; background: #f1eee8; font-size: 9px; }
.view { max-width: 1420px; margin: auto; padding: 42px 5vw 90px; outline: none; }

.eyebrow { margin-bottom: 12px; color: var(--blue); font-size: 10px; font-weight: 900; letter-spacing: .17em; text-transform: uppercase; }
h1, h2, h3, h4 { margin-top: 0; line-height: 1.08; letter-spacing: -.035em; }
h1 { margin-bottom: 24px; font-size: clamp(44px, 7vw, 88px); }
h2 { margin-bottom: 18px; font-size: clamp(31px, 4vw, 54px); }
h3 { font-size: 25px; }
.lead { max-width: 820px; color: var(--ink-soft); font: 23px/1.5 Georgia, serif; }
.button { min-height: 45px; padding: 11px 18px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; border: 0; border-radius: 14px; font-weight: 800; transition: transform .18s, box-shadow .18s; }
.button:hover { transform: translateY(-2px); }
.button-primary { background: var(--blue); color: #fff; box-shadow: 0 8px 24px rgba(39,93,245,.25); }
.button-dark { background: var(--ink); color: #fff; }
.button-light { background: #fff; color: var(--ink); }
.button-outline { border: 1px solid var(--line); background: transparent; color: var(--ink); }
.button-success { background: var(--green); color: #fff; }

.hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(290px, .7fr); gap: 30px; align-items: stretch; }
.hero-copy { padding: 28px 0; }
.hero h1 em { position: relative; color: var(--coral); font-style: normal; }
.hero h1 em::after { content: ""; height: 7px; position: absolute; right: 0; bottom: -5px; left: 0; border-radius: 50%; background: var(--gold); transform: rotate(-1deg); }
.hero-actions { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 11px; }
.hero-card { min-height: 420px; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; border-radius: 30px; background: var(--ink); color: #fff; box-shadow: var(--shadow); }
.hero-card::before { content: ""; width: 250px; height: 250px; position: absolute; top: -90px; right: -90px; border: 2px solid rgba(255,255,255,.13); border-radius: 50%; box-shadow: 0 0 0 55px rgba(255,255,255,.025); }
.hero-question { color: var(--cyan); font: 120px/.7 Georgia, serif; }
.hero-card blockquote { margin: 0; position: relative; font: 23px/1.35 Georgia, serif; }
.hero-card cite { margin-top: 14px; display: block; color: #aebdd3; font: 11px/1.5 Inter, sans-serif; }
.stats { margin: 42px 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.stat strong { display: block; font-size: 26px; }
.stat span { color: #737e92; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.section-heading { margin: 52px 0 21px; display: flex; align-items: end; justify-content: space-between; gap: 25px; }
.section-heading p { max-width: 520px; margin: 0; color: #667187; }
.part-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 17px; }
.part-card { min-height: 245px; padding: 24px; position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); transition: .2s; }
.part-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
.part-card-number { position: absolute; top: -13px; right: 14px; opacity: .07; font: 80px Georgia, serif; }
.tag { padding: 5px 9px; display: inline-flex; border-radius: 999px; background: #e2e8ff; color: var(--blue); font-size: 9px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
.part-card h3 { margin: 26px 0 10px; }
.part-card p { color: #687389; font-size: 13px; }
.part-chapters { margin-top: 18px; display: flex; gap: 6px; }
.part-chapters i { width: 9px; height: 9px; border-radius: 50%; background: #d7d6d3; }
.part-chapters i.done { background: var(--cyan); }
.daily-card { margin-top: 20px; padding: 26px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 20px; border-radius: var(--radius); background: var(--gold); }
.daily-card p { margin: 5px 0 0; }

.chapter-header { margin-bottom: 34px; display: grid; grid-template-columns: minmax(0, 1fr) 260px; align-items: end; gap: 30px; }
.chapter-header-number { color: transparent; text-align: right; font: 160px/.65 Georgia, serif; -webkit-text-stroke: 2px rgba(19,35,63,.17); }
.chapter-meta { display: flex; flex-wrap: wrap; gap: 9px; }
.pill { padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 10px; font-weight: 800; }
.chapter-quote { max-width: 760px; margin: 25px 0 0; padding-left: 18px; border-left: 4px solid var(--gold); color: #48556c; font: 18px/1.5 Georgia, serif; }
.reading-layout { display: grid; grid-template-columns: minmax(0, 760px) 290px; justify-content: center; gap: 30px; align-items: start; }
.reading-column { min-width: 0; }
.reading-column > p { margin: 0 0 1.25em; color: #2c3d58; font: 18px/1.78 Georgia, serif; }
.reading-column > h2 { margin: 2.1em 0 .65em; font-size: 35px; }
.reading-column > h3 { margin: 1.8em 0 .65em; font-size: 25px; }
.reading-tools { position: sticky; top: 104px; display: grid; gap: 14px; }
.tool-card { padding: 19px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.tool-card h4 { margin-bottom: 9px; font-size: 17px; }
.tool-card p, .tool-card li { color: #647087; font-size: 12px; }
.tool-card ul { padding-left: 18px; }
.tool-card textarea { width: 100%; min-height: 120px; padding: 11px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.reading-progress { height: 6px; overflow: hidden; border-radius: 999px; background: #e1dbd0; }
.reading-progress i { display: block; height: 100%; background: var(--blue); }
.chapter-box { margin: 28px 0; padding: 24px; border-radius: 20px; background: #fff; border: 1px solid var(--line); }
.chapter-box h3 { margin-bottom: 15px; font-size: 20px; }
.chapter-box p { margin: 8px 0; color: #3c4b63; }
.chapter-box.case { border: 0; background: var(--ink); color: #fff; }
.chapter-box.case p { color: #dbe3ef; }
.chapter-box.remember { border: 0; background: #e8f7f4; }
.chapter-box.warning { border: 0; background: #fff0cf; }
.chapter-box.opening_quiz { border: 2px solid var(--blue); background: #eef2ff; }
.chapter-box.mini_exercise, .chapter-box.practice { background: #f1ecff; }
.chapter-box.checklist { background: #edf7d8; }
.chapter-box.exercises { background: #fff5ed; }
.box-lines { display: grid; gap: 6px; }
.quiz-options { display: grid; gap: 9px; }
.quiz-options .button { width: 100%; justify-content: flex-start; text-align: left; }
.quiz-options .button > span { width: 25px; height: 25px; display: grid; place-items: center; flex: none; border-radius: 8px; background: rgba(19,35,63,.08); font-size: 11px; }
.quiz-feedback { margin-top: 14px; }
.reflection { margin-top: 13px; padding-top: 13px; border-top: 1px solid rgba(19,35,63,.12); }
.reflection textarea { width: 100%; min-height: 80px; padding: 11px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.85); resize: vertical; }
.chapter-footer { margin-top: 38px; padding-top: 22px; display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); }

.lab-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 17px; }
.lab-card { min-height: 270px; padding: 25px; position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.lab-card:nth-child(1) { background: #e8f7f4; }
.lab-card:nth-child(2) { background: #fff0cf; }
.lab-card:nth-child(3) { background: #eef2ff; }
.lab-card:nth-child(4) { background: #ffe9e5; }
.lab-card .lab-icon { margin-bottom: 25px; font-size: 34px; }
.lab-card p { color: #536078; }
.lab-panel { margin-top: 26px; padding: clamp(22px,4vw,42px); border: 1px solid var(--line); border-radius: 26px; background: var(--surface); }
.two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: center; }
.control label { margin: 17px 0 7px; display: block; font-weight: 800; }
.control input[type="range"] { width: 100%; accent-color: var(--blue); }
.range-labels { display: flex; justify-content: space-between; color: #737e92; font-size: 10px; }
.results-grid { margin-top: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.result { padding: 13px; border-radius: 13px; background: var(--surface-2); }
.result strong { display: block; font-size: 21px; }
.result span { color: #6b758a; font-size: 9px; letter-spacing: .05em; text-transform: uppercase; }
.ring { width: 270px; height: 270px; margin: auto; display: grid; place-items: center; position: relative; border-radius: 50%; }
.ring::after { content: ""; position: absolute; inset: 28px; border-radius: 50%; background: var(--surface); }
.ring-content { position: relative; z-index: 1; text-align: center; }
.ring-content strong { display: block; font-size: 45px; }
.ring-content span { color: #687389; font-size: 10px; text-transform: uppercase; }
.cause-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.cause-option { padding: 17px; border: 1px solid var(--line); border-radius: 16px; background: #faf8f2; text-align: left; }
.cause-option.active { border: 2px solid var(--cyan); background: #e7fafa; }
.explanation { margin-top: 15px; padding: 18px; border-radius: 15px; background: var(--ink); color: #fff; }
.probability-tree { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.probability-node { padding: 17px; border-radius: 16px; background: var(--surface-2); }
.probability-node strong { display: block; font-size: 26px; }
.chart-wrap { min-height: 330px; display: flex; align-items: end; justify-content: center; gap: 45px; padding: 30px; border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
.bar { width: 85px; min-height: 8px; position: relative; background: var(--blue); border-radius: 8px 8px 0 0; transition: height .4s; }
.bar.coral { background: var(--coral); }
.bar span { width: 130px; position: absolute; bottom: -52px; left: 50%; transform: translateX(-50%); text-align: center; font-size: 11px; }

.practice-list { display: grid; gap: 13px; }
.practice-item { padding: 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.practice-number { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: #fff; font: 20px Georgia, serif; }
.practice-item h3 { margin: 0 0 5px; font-size: 19px; }
.practice-item p { margin: 0; color: #69748a; font-size: 13px; }
.practice-check { width: 32px; height: 32px; border: 2px solid var(--line); border-radius: 50%; background: transparent; }
.practice-item.done { background: #eaf7ed; }
.practice-item.done .practice-check { border-color: var(--green); background: var(--green); color: #fff; }
.glossary-controls { margin: 25px 0; display: flex; gap: 10px; }
.text-input { width: 100%; padding: 13px 15px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); color: var(--ink); }
.glossary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.term-card { padding: 19px; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); }
.term-card h3 { margin-bottom: 8px; font-size: 19px; }
.term-card p { margin: 0; color: #59667d; font-size: 13px; }
.notebook-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.notebook-form, .notebook-entry { padding: 22px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); }
.notebook-form textarea { width: 100%; min-height: 220px; padding: 14px; border: 1px solid var(--line); border-radius: 13px; resize: vertical; }
.notebook-form select { width: 100%; margin: 10px 0; padding: 11px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.notebook-entries { display: grid; gap: 11px; align-content: start; }
.notebook-entry small { color: #778197; }
.notebook-entry p { margin-bottom: 0; }

.overlay { visibility: hidden; opacity: 0; position: fixed; inset: 0; z-index: 70; background: rgba(8,18,34,.58); backdrop-filter: blur(4px); transition: .2s; }
.overlay.open { visibility: visible; opacity: 1; }
.search-dialog { visibility: hidden; opacity: 0; width: min(720px, calc(100vw - 30px)); max-height: 75vh; position: fixed; top: 12vh; left: 50%; z-index: 80; overflow: hidden; transform: translate(-50%, -15px); border-radius: 22px; background: var(--surface); box-shadow: 0 35px 100px rgba(0,0,0,.28); transition: .2s; }
.search-dialog.open { visibility: visible; opacity: 1; transform: translate(-50%, 0); }
.search-head { padding: 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); }
.search-head input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 17px; }
.search-results { max-height: 58vh; overflow-y: auto; padding: 9px; }
.search-result { width: 100%; padding: 13px; display: block; border: 0; border-radius: 12px; background: transparent; color: var(--ink); text-align: left; }
.search-result:hover { background: var(--surface-2); }
.search-result strong { display: block; }
.search-result span { color: #6d778c; font-size: 11px; }
.toast { visibility: hidden; opacity: 0; position: fixed; right: 24px; bottom: 24px; z-index: 100; padding: 13px 18px; border-radius: 13px; background: var(--ink); color: #fff; box-shadow: var(--shadow); transform: translateY(20px); transition: .25s; }
.toast.show { visibility: visible; opacity: 1; transform: translateY(0); }

@media (max-width: 1100px) {
  :root { --sidebar: 240px; }
  .hero { grid-template-columns: 1fr; }
  .hero-card { min-height: 290px; }
  .part-grid { grid-template-columns: 1fr; }
  .reading-layout { grid-template-columns: minmax(0, 720px); }
  .reading-tools { position: static; grid-template-columns: repeat(2, 1fr); }
  .lab-grid { grid-template-columns: 1fr; }
  .cause-options { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 760px) {
  .shell { display: block; }
  .sidebar { width: 280px; position: fixed; left: -300px; box-shadow: 25px 0 60px rgba(0,0,0,.25); transition: left .25s; }
  .sidebar.open { left: 0; }
  .menu-button { display: inline-block; }
  .topbar { height: 68px; padding: 0 16px; }
  .breadcrumb, .search-label, .search-button kbd { display: none; }
  .search-button { min-width: 40px; width: 40px; height: 40px; padding: 0; justify-content: center; }
  .view { padding: 26px 17px 70px; }
  .hero-copy { padding-top: 4px; }
  .hero-card { min-height: 270px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .daily-card, .chapter-header, .two-column, .notebook-grid { grid-template-columns: 1fr; }
  .chapter-header-number { display: none; }
  .reading-column > p { font-size: 17px; }
  .reading-tools, .glossary-grid { grid-template-columns: 1fr; }
  .chapter-footer { flex-direction: column; }
  .chapter-footer .button { width: 100%; }
  .results-grid, .probability-tree { grid-template-columns: 1fr; }
  .cause-options { grid-template-columns: 1fr; }
  .practice-item { grid-template-columns: auto 1fr; }
  .practice-check { grid-column: 1 / -1; width: 100%; border-radius: 12px; }
}

@media print {
  .sidebar, .topbar, .reading-tools, .chapter-footer { display: none !important; }
  .shell { display: block; }
  .view { max-width: none; padding: 0; }
  .reading-layout { display: block; }
  body { background: #fff; }
}

</style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigazione principale">
      <a class="brand" href="#home" data-route="home" aria-label="Torna alla pagina iniziale">
        <span class="brand-symbol" aria-hidden="true">⌁</span>
        <span><strong>Pensare come<br>uno scienziato</strong><small>Marco Piovesan</small></span>
      </a>

      <nav class="main-nav">
        <button class="nav-item active" data-route="home"><span>⌂</span>Scrivania</button>
        <button class="nav-item" data-route="lab"><span>⚗</span>Laboratori</button>
        <button class="nav-item" data-route="practice"><span>◉</span>Sette pratiche</button>
        <button class="nav-item" data-route="glossary"><span>A–Z</span>Glossario</button>
        <button class="nav-item" data-route="notebook"><span>✎</span>Quaderno</button>
      </nav>

      <div class="course-nav" id="courseNav"></div>

      <div class="sidebar-progress">
        <div><span>Progresso</span><strong id="progressText">0%</strong></div>
        <div class="progress-track"><i id="progressBar"></i></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" aria-label="Apri il menu">☰</button>
        <div class="breadcrumb" id="breadcrumb">Scrivania</div>
        <div class="top-actions">
          <button class="search-button" id="searchButton" aria-label="Apri la ricerca"><span>⌕</span><span class="search-label">Cerca nel libro</span><kbd>⌘ K</kbd></button>
          <button class="icon-button" id="randomButton" title="Apri una domanda casuale" aria-label="Domanda casuale">?</button>
        </div>
      </header>
      <div class="view" id="view" tabindex="-1"></div>
    </main>
  </div>

  <div class="overlay" id="overlay"></div>

  "glossary": [
    {
      "term": "Bias cognitivo",
      "definition": "Un errore sistematico nel ragionamento, che porta a giudizi distorti in modo prevedibile. Diverso da un errore casuale: i bias operano sempre nella stessa direzione."
    },
    {
      "term": "Bias di conferma",
      "definition": "La tendenza a cercare, interpretare e ricordare le informazioni in modo da confermare le proprie credenze preesistenti."
    },
    {
      "term": "Causalità",
      "definition": "Una relazione in cui un evento (la causa) produce o aumenta la probabilità di un altro evento (l'effetto). Diversa dalla correlazione, che è solo una co-variazione."
    },
    {
      "term": "Correlazione",
      "definition": "Una relazione statistica tra due variabili che tendono a variare insieme. Non implica causalità."
    },
    {
      "term": "Doppio cieco",
      "definition": "Un disegno sperimentale in cui né i partecipanti né i ricercatori che raccolgono i dati sanno chi riceve il trattamento e chi il placebo."
    },
    {
      "term": "Effetto Forer (o Barnum)",
      "definition": "La tendenza delle persone ad accettare come accuratamente personalizzate descrizioni vaghe della propria personalità che si adatterebbero a chiunque."
    },
    {
      "term": "Euristica",
      "definition": "Una scorciatoia mentale che permette di prendere decisioni rapide con informazioni incomplete. Utile nella vita quotidiana, ma fonte di bias sistematici in contesti che richiedono ragionamento preciso."
    },
    {
      "term": "Falsificabilità",
      "definition": "La proprietà di una teoria di fare previsioni che potrebbero, in linea di principio, rivelarsi false. Una teoria non falsificabile non è scientifica."
    },
    {
      "term": "Filter bubble",
      "definition": "La bolla informativa creata dagli algoritmi di raccomandazione dei social media, che mostrano all'utente contenuti coerenti con le sue preferenze preesistenti, amplificando il bias di conferma."
    },
    {
      "term": "Hallucination (AI)",
      "definition": "La tendenza dei Large Language Models a generare informazioni false (citazioni inesistenti, fatti inventati) con la stessa fluenza con cui generano informazioni vere."
    },
    {
      "term": "Intervallo di confidenza",
      "definition": "Un range di valori che, con una certa probabilità (tipicamente 95%), contiene il valore vero del parametro stimato. Più informativo del p-value."
    },
    {
      "term": "Large Language Model (LLM)",
      "definition": "Modello di intelligenza artificiale addestrato su grandi quantità di testo, in grado di generare linguaggio naturale. Esempi: ChatGPT, Gemini, Claude."
    },
    {
      "term": "Meta-analisi",
      "definition": "Una tecnica statistica che combina i risultati di più studi per ottenere una stima complessiva più precisa e affidabile di un effetto."
    },
    {
      "term": "NNT (Number Needed to Treat)",
      "definition": "Il numero di persone da trattare per evitare un evento sfavorevole. Misura dell'effetto assoluto di un trattamento nella pratica clinica."
    },
    {
      "term": "Peer review",
      "definition": "La revisione di un manoscritto scientifico da parte di altri esperti del settore, prima della pubblicazione."
    },
    {
      "term": "Placebo",
      "definition": "Un trattamento inattivo usato come gruppo di controllo negli studi clinici."
    },
    {
      "term": "Preprint",
      "definition": "Un manoscritto scientifico pubblicato online prima di aver completato la peer review. Non ha superato il controllo indipendente della comunità scientifica."
    },
    {
      "term": "P-value",
      "definition": "La probabilità di osservare risultati almeno altrettanto estremi di quelli ottenuti, assumendo che l'ipotesi nulla sia vera. Non misura la probabilità che un risultato sia vero."
    },
    {
      "term": "Publication bias",
      "definition": "La tendenza delle riviste scientifiche a pubblicare preferenzialmente studi con risultati positivi, distorcendo la letteratura disponibile."
    },
    {
      "term": "Randomizzazione",
      "definition": "L'assegnazione casuale dei partecipanti ai gruppi sperimentali. Garantisce che le differenze tra i gruppi siano dovute al trattamento, non a caratteristiche preesistenti."
    },
    {
      "term": "Replicazione",
      "definition": "La ripetizione di uno studio da parte di ricercatori indipendenti, per verificare se i risultati originali si confermano."
    },
    {
      "term": "Revisione sistematica",
      "definition": "Una sintesi di tutti gli studi pubblicati su una domanda specifica, condotta secondo criteri espliciti e riproducibili."
    },
    {
      "term": "Rischio assoluto",
      "definition": "La probabilità di un evento in termini assoluti. Diverso dal rischio relativo, che esprime il confronto tra gruppi."
    },
    {
      "term": "Science washing",
      "definition": "L'uso del linguaggio scientifico da parte di brand o influencer per dare credibilità a prodotti o affermazioni non adeguatamente supportati da prove scientifiche indipendenti."
    },
    {
      "term": "Variabile confondente",
      "definition": "Una variabile non controllata che è associata sia alla causa presunta che all'effetto, e che può spiegare (o distorcere) la relazione osservata."

  <script>

        </article>
        <aside class="reading-tools">
          <div class="tool-card"><h4>Avanzamento</h4><p>${storage.done.has(chapter.number) ? 'Hai completato questo capitolo.' : 'Completa la lettura e verifica il ragionamento.'}</p><div class="reading-progress"><i style="width:${storage.done.has(chapter.number) ? 100 : 18}%"></i></div></div>
          <div class="tool-card"><h4>Nota personale</h4><p>Annota un dubbio, una prova da cercare o qualcosa che ti ha fatto cambiare prospettiva.</p><textarea id="chapterNote" placeholder="La mia nota…">${escapeHTML(note)}</textarea><button class="button button-outline" id="saveChapterNote">Salva la nota</button></div>
          <div class="tool-card"><h4>Strumenti collegati</h4><button class="button button-dark" data-route="lab">Apri i laboratori</button></div>
        </aside>
      </div>
      <footer class="chapter-footer"><button class="button button-outline" data-route="${chapter.number === 1 ? 'section/introduction' : `chapter/${chapter.number - 1}`}">← Precedente</button><button class="button ${storage.done.has(chapter.number) ? 'button-success' : 'button-primary'}" id="completeChapter">${storage.done.has(chapter.number) ? '✓ Capitolo completato' : 'Segna come completato'}</button><button class="button button-dark" data-route="${chapter.number === 12 ? 'section/conclusion' : `chapter/${chapter.number + 1}`}">Successivo →</button></footer>`;
  }

  function labsView(selected) {
    const cards = [
      ['risk', '％', 'Rischio relativo e assoluto', 'Scopri perché una riduzione del 50% può essere enorme o quasi irrilevante.'],
      ['cause', '⇄', 'Correlazione e causalità', 'Esamina quattro spiegazioni alternative per la stessa correlazione.'],
      ['bayes', 'P', 'Il test diagnostico', 'Aggiorna una probabilità usando prevalenza, sensibilità e falsi positivi.'],
      ['chart', '▥', 'Grafici che ingannano', 'Osserva come un asse troncato amplifica una differenza modesta.'],
    ];
    return `<div class="eyebrow">Prova, osserva, aggiorna</div><h2>Laboratori del ragionamento</h2><p class="lead">Gli strumenti del libro diventano manipolabili. Cambia i dati e guarda come cambia la conclusione.</p><section class="lab-grid">${cards.map(card => `<article class="lab-card"><div class="lab-icon">${card[1]}</div><h3>${card[2]}</h3><p>${card[3]}</p><button class="button button-dark" data-route="lab/${card[0]}">Apri</button></article>`).join('')}</section>${selected ? `<section class="lab-panel" id="labPanel">${labPanel(selected)}</section>` : ''}`;
  }

  function labPanel(type) {
    if (type === 'risk') return `<div class="two-column"><div class="control"><div class="eyebrow">Simulatore</div><h3>Il rischio dietro la percentuale</h3><p>Imposta il rischio di base e la riduzione relativa promessa.</p><label>Rischio iniziale: <strong id="baseOutput">10%</strong></label><input id="baseRisk" type="range" min="0.1" max="50" step="0.1" value="10"><div class="range-labels"><span>0,1%</span><span>50%</span></div><label>Riduzione relativa: <strong id="relativeOutput">50%</strong></label><input id="relativeRisk" type="range" min="1" max="90" value="50"><div class="results-grid"><div class="result"><strong id="newRisk"></strong><span>Nuovo rischio</span></div><div class="result"><strong id="absoluteDrop"></strong><span>Riduzione assoluta</span></div><div class="result"><strong id="nnt"></strong><span>Numero da trattare</span></div></div></div><div class="ring" id="riskRing"><div class="ring-content"><strong id="ringValue"></strong><span>rischio dopo<br>il trattamento</span></div></div></div>`;
    if (type === 'cause') return `<div class="eyebrow">Quattro ipotesi</div><h3>Più gelati, più annegamenti</h3><p>Due variabili crescono insieme. Seleziona una spiegazione prima di concludere.</p><div class="cause-options">${[['A → B', 'I gelati causano annegamenti'], ['B → A', 'Gli annegamenti aumentano i gelati'], ['C → A e B', 'Il caldo aumenta gelati e nuotate'], ['Caso', 'La relazione è una coincidenza']].map((item, i) => `<button class="cause-option" data-cause="${i}"><strong>${item[0]}</strong><p>${item[1]}</p></button>`).join('')}</div><div class="explanation" id="causeExplanation">Una correlazione apre un’indagine: non la chiude.</div>`;
    if (type === 'bayes') return `<div class="two-column"><div class="control"><div class="eyebrow">Aggiornamento bayesiano</div><h3>Quanto vale un test positivo?</h3><label>Prevalenza della malattia: <strong id="prevalenceOutput">10%</strong></label><input id="prevalence" type="range" min="1" max="50" value="10"><label>Sensibilità del test: <strong id="sensitivityOutput">90%</strong></label><input id="sensitivity" type="range" min="50" max="100" value="90"><label>Falsi positivi: <strong id="falsePositiveOutput">10%</strong></label><input id="falsePositive" type="range" min="1" max="40" value="10"></div><div><h3>Su 1.000 persone</h3><div class="probability-tree"><div class="probability-node"><span>Veri positivi</span><strong id="truePositives"></strong></div><div class="probability-node"><span>Falsi positivi</span><strong id="falsePositives"></strong></div><div class="probability-node"><span>Positivi totali</span><strong id="totalPositives"></strong></div><div class="probability-node"><span>Probabilità reale</span><strong id="posterior"></strong></div></div><p id="bayesExplanation"></p></div></div>`;
    return `<div class="two-column"><div class="control"><div class="eyebrow">Percezione visiva</div><h3>La stessa differenza, due impressioni</h3><p>Regione A: 850 casi. Regione B: 1.050 casi.</p><label>Inizio dell’asse Y: <strong id="axisOutput">0</strong></label><input id="axisStart" type="range" min="0" max="840" step="20" value="0"><p>La differenza reale è del 23,5%. Spostando l’origine, la barra B può sembrare molte volte più alta.</p></div><div class="chart-wrap"><div class="bar" id="barA"><span>Regione A<br>850</span></div><div class="bar coral" id="barB"><span>Regione B<br>1.050</span></div></div></div>`;
  }

  function practiceView() {
    return `<div class="eyebrow">Capitolo 12 · Applicazione</div><h2>Le sette pratiche quotidiane</h2><p class="lead">Il pensiero scientifico non è qualcosa che si possiede. È qualcosa che si fa, soprattutto quando sarebbe più comodo concludere in fretta.</p><section class="practice-list">${practices.map((practice, i) => `<article class="practice-item ${storage.practices.has(i) ? 'done' : ''}"><div class="practice-number">${i + 1}</div><div><h3>${practice[0]}</h3><p>${practice[1]}</p></div><button class="practice-check" data-practice="${i}" aria-label="${storage.practices.has(i) ? 'Pratica completata' : 'Segna la pratica come completata'}">${storage.practices.has(i) ? '✓' : ''}</button></article>`).join('')}</section><div class="daily-card"><div><strong>Impegno concreto</strong><p>Scegli una sola pratica e applicala in tre situazioni reali durante la settimana.</p></div><button class="button button-dark" data-route="notebook">Annota l’impegno</button></div>`;
  }

  function glossaryView(query = '') {
    const normalized = query.trim().toLowerCase();
    const terms = book.glossary.filter(item => `${item.term} ${item.definition}`.toLowerCase().includes(normalized));
    return `<div class="eyebrow">25 concetti essenziali</div><h2>Glossario</h2><p class="lead">Le parole necessarie per leggere studi, notizie e affermazioni scientifiche senza farsi guidare dal suono tecnico.</p><div class="glossary-controls"><input class="text-input" id="glossarySearch" value="${escapeHTML(query)}" placeholder="Cerca un termine o una definizione…"></div><section class="glossary-grid" id="glossaryGrid">${terms.map(item => `<article class="term-card"><h3>${escapeHTML(item.term)}</h3><p>${escapeHTML(item.definition)}</p></article>`).join('') || '<div class="empty">Nessun termine trovato.</div>'}</section>`;
  }

  function notebookView() {
    const chapterNotes = Object.entries(storage.notes).filter(([, value]) => value).map(([chapter, text]) => ({ type: `Nota dal capitolo ${chapter}`, text, date: '' }));
    const reflections = Object.entries(storage.reflections).filter(([, value]) => value).map(([key, text]) => ({ type: `Esercizio ${key}`, text, date: '' }));
    const entries = [...storage.notebook, ...chapterNotes, ...reflections].reverse();
    return `<div class="eyebrow">Rendi il ragionamento ispezionabile</div><h2>Quaderno di ricerca</h2><p class="lead">Domande, prove contrarie, decisioni e cambiamenti di idea restano sul tuo dispositivo.</p><div class="notebook-grid"><section class="notebook-form"><h3>Nuova osservazione</h3><select id="noteType"><option>Domanda da indagare</option><option>Prova contraria</option><option>Ho cambiato idea</option><option>Decisione da verificare</option></select><textarea id="newNote" placeholder="Che cosa hai osservato? Quale dato manca? Che cosa potrebbe smentire la tua ipotesi?"></textarea><button class="button button-primary" id="addNote">Aggiungi al quaderno</button></section><section class="notebook-entries">${entries.length ? entries.map(entry => `<article class="notebook-entry"><small>${escapeHTML(entry.type)} ${entry.date ? `· ${escapeHTML(entry.date)}` : ''}</small><p>${escapeHTML(entry.text)}</p></article>`).join('') : '<div class="empty">Il quaderno è vuoto. Una buona indagine può iniziare da una sola domanda.</div>'}</section></div>`;
  }

  function renderRoute() {
    const [route, value] = routeParts();
    let html;
    let title;
    if (route === 'chapter') {
      const chapter = book.chapters.find(item => item.number === Number(value)) || book.chapters[0];
      html = chapterView(chapter);
      title = `Capitolo ${chapter.number} · ${chapter.title}`;
      setActive(`chapter/${chapter.number}`);
    } else if (route === 'section') {
      html = sectionView(value);
      title = value === 'conclusion' ? 'Conclusione' : value === 'readings' ? 'Letture consigliate' : 'Introduzione';
      setActive(`section/${value}`);
    } else if (route === 'lab') {
      html = labsView(value);
      title = 'Laboratori';
      setActive('lab');
    } else if (route === 'practice') {
      html = practiceView(); title = 'Sette pratiche'; setActive('practice');
    } else if (route === 'glossary') {
      html = glossaryView(); title = 'Glossario'; setActive('glossary');
    } else if (route === 'notebook') {
      html = notebookView(); title = 'Quaderno'; setActive('notebook');
    } else {
      html = homeView(); title = 'Scrivania'; setActive('home');
    }
    view.innerHTML = html;
    $('#breadcrumb').textContent = title;
    document.title = `${title} · ${book.title}`;
    bindView(route, value);
    window.scrollTo({ top: 0, behavior: 'instant' });
    view.focus({ preventScroll: true });
  }

  function bindView(route, value) {
    if (route === 'chapter') {
      const chapterNumber = Number(value) || 1;
      $$('.save-reflection').forEach(button => button.addEventListener('click', () => {
        const area = $(`[data-reflection="${button.dataset.key}"]`);
        storage.reflections[button.dataset.key] = area.value.trim();
        save(); toast('Risposta salvata nel quaderno');
      }));
      $('#saveChapterNote')?.addEventListener('click', () => {
        storage.notes[chapterNumber] = $('#chapterNote').value.trim();
        save(); toast('Nota salvata');
      });
      $('#completeChapter')?.addEventListener('click', event => {
        storage.done.add(chapterNumber); save();
        event.currentTarget.className = 'button button-success';
        event.currentTarget.textContent = '✓ Capitolo completato';
        toast('Capitolo completato');
      });
      $$('.quiz-option').forEach(button => button.addEventListener('click', () => {
        const data = quiz[chapterNumber - 1];
        const answer = Number(button.dataset.answer);
        $$('.quiz-option').forEach((option, index) => {
          option.disabled = true;
          if (index === data[2]) option.classList.add('button-success');
        });
        if (answer !== data[2]) button.style.borderColor = 'var(--red)';
        $('.quiz-feedback').innerHTML = `<p><strong>${answer === data[2] ? 'Esatto.' : 'Non proprio.'}</strong> ${escapeHTML(data[3])}</p>`;
      }));
    }
    if (route === 'lab' && value) bindLab(value);
    if (route === 'practice') $$('.practice-check').forEach(button => button.addEventListener('click', () => {
      const index = Number(button.dataset.practice);
      if (storage.practices.has(index)) storage.practices.delete(index); else storage.practices.add(index);
      save(); renderRoute();
    }));
    if (route === 'glossary') $('#glossarySearch')?.addEventListener('input', event => {
      const query = event.target.value.toLowerCase();
      $$('.term-card').forEach(card => card.hidden = !card.textContent.toLowerCase().includes(query));
    });
    if (route === 'notebook') $('#addNote')?.addEventListener('click', () => {
      const text = $('#newNote').value.trim();
      if (!text) return toast('Scrivi prima un’osservazione');
      storage.notebook.push({ type: $('#noteType').value, text, date: new Date().toLocaleDateString('it-IT') });
      save(); toast('Osservazione aggiunta'); renderRoute();
    });
  }

  function bindLab(type) {
    if (type === 'risk') {
      const calculate = () => {
        const base = Number($('#baseRisk').value);
        const relative = Number($('#relativeRisk').value);
        const next = base * (1 - relative / 100);
        const drop = base - next;
        $('#baseOutput').textContent = `${base.toLocaleString('it-IT')}%`;
        $('#relativeOutput').textContent = `${relative}%`;
        $('#newRisk').textContent = `${next.toLocaleString('it-IT', { maximumFractionDigits: 2 })}%`;
        $('#absoluteDrop').textContent = `${drop.toLocaleString('it-IT', { maximumFractionDigits: 2 })} pp`;
        $('#nnt').textContent = Math.ceil(100 / drop).toLocaleString('it-IT');
        $('#ringValue').textContent = `${next.toLocaleString('it-IT', { maximumFractionDigits: 1 })}%`;
        $('#riskRing').style.background = `conic-gradient(var(--coral) ${Math.min(360, next / 50 * 360)}deg, #e3ddd2 0)`;
      };
      $('#baseRisk').addEventListener('input', calculate); $('#relativeRisk').addEventListener('input', calculate); calculate();
    }
    if (type === 'cause') {
      const explanations = ['È possibile in astratto, ma servirebbero un meccanismo plausibile e prove sperimentali.', 'Anche la causalità inversa va considerata, benché in questo caso sia poco plausibile.', 'È l’ipotesi più plausibile: la temperatura aumenta sia il consumo di gelati sia il numero di persone che nuotano.', 'Può accadere, soprattutto facendo molti confronti. La replicazione aiuta a distinguere coincidenza e segnale.'];
      $$('.cause-option').forEach(button => button.addEventListener('click', () => {
        $$('.cause-option').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        $('#causeExplanation').textContent = explanations[Number(button.dataset.cause)];
      }));
    }
    if (type === 'bayes') {
      const calculate = () => {
        const prevalence = Number($('#prevalence').value) / 100;
        const sensitivity = Number($('#sensitivity').value) / 100;
        const falseRate = Number($('#falsePositive').value) / 100;
        const truePositives = 1000 * prevalence * sensitivity;
        const falsePositives = 1000 * (1 - prevalence) * falseRate;
        const total = truePositives + falsePositives;
        const posterior = truePositives / total * 100;
        $('#prevalenceOutput').textContent = `${Math.round(prevalence * 100)}%`;
        $('#sensitivityOutput').textContent = `${Math.round(sensitivity * 100)}%`;
        $('#falsePositiveOutput').textContent = `${Math.round(falseRate * 100)}%`;
        $('#truePositives').textContent = Math.round(truePositives);
        $('#falsePositives').textContent = Math.round(falsePositives);
        $('#totalPositives').textContent = Math.round(total);
        $('#posterior').textContent = `${posterior.toFixed(1).replace('.', ',')}%`;
        $('#bayesExplanation').textContent = `Fra tutte le persone positive, circa ${Math.round(posterior)} su 100 hanno davvero la malattia.`;
      };
      ['prevalence', 'sensitivity', 'falsePositive'].forEach(id => $(`#${id}`).addEventListener('input', calculate)); calculate();
    }
    if (type === 'chart') {
      const update = () => {
        const origin = Number($('#axisStart').value);
        const scale = 280 / (1100 - origin);
        $('#axisOutput').textContent = origin.toLocaleString('it-IT');
        $('#barA').style.height = `${Math.max(8, (850 - origin) * scale)}px`;
        $('#barB').style.height = `${Math.max(8, (1050 - origin) * scale)}px`;
      };
      $('#axisStart').addEventListener('input', update); update();
    }
  }

  function buildSearchIndex() {
    const items = [];
    book.chapters.forEach(chapter => chapter.blocks.forEach(block => {
      const text = block.text || [block.title, ...(block.lines || [])].join(' ');
      if (text) items.push({ title: `Capitolo ${chapter.number} · ${chapter.title}`, route: `chapter/${chapter.number}`, text });
    }));
    book.glossary.forEach(item => items.push({ title: item.term, route: 'glossary', text: item.definition }));
    return items;
  }

  const searchIndex = buildSearchIndex();
  function openSearch() { $('#overlay').classList.add('open'); $('#searchDialog').classList.add('open'); setTimeout(() => $('#searchInput').focus(), 50); }
  function closeSearch() { $('#overlay').classList.remove('open'); $('#searchDialog').classList.remove('open'); $('#searchInput').value = ''; $('#searchResults').innerHTML = ''; }
  function runSearch(query) {
    const words = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
    if (!words.length) { $('#searchResults').innerHTML = '<div class="empty">Scrivi almeno una parola.</div>'; return; }
    const results = searchIndex.filter(item => words.every(word => `${item.title} ${item.text}`.toLowerCase().includes(word))).slice(0, 30);
    $('#searchResults').innerHTML = results.length ? results.map(item => `<button class="search-result" data-search-route="${item.route}"><strong>${escapeHTML(item.title)}</strong><span>${escapeHTML(item.text.slice(0, 180))}${item.text.length > 180 ? '…' : ''}</span></button>`).join('') : '<div class="empty">Nessun risultato.</div>';
  }

  document.addEventListener('click', event => {
    const routeButton = event.target.closest('[data-route]');
    if (routeButton) { event.preventDefault(); navigate(routeButton.dataset.route); }
    const searchResult = event.target.closest('[data-search-route]');
    if (searchResult) { closeSearch(); navigate(searchResult.dataset.searchRoute); }
  });
  $('#menuButton').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
  $('#searchButton').addEventListener('click', openSearch);
  $('#closeSearch').addEventListener('click', closeSearch);
  $('#overlay').addEventListener('click', closeSearch);
  $('#searchInput').addEventListener('input', event => runSearch(event.target.value));
  $('#randomButton').addEventListener('click', () => navigate(`chapter/${1 + Math.floor(Math.random() * 12)}`));
  document.addEventListener('keydown', event => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); openSearch(); }
    if (event.key === 'Escape') closeSearch();
  });
  window.addEventListener('hashchange', renderRoute);

  renderNavigation();
  updateProgress();
  renderRoute();
})();

</script>
</body>
</html>
