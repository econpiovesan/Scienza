<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#173a5e">
  <title>Pensare come uno scienziato · Scuola primaria</title>
  <style>
    :root{--ink:#173a5e;--text:#25364a;--paper:#fffaf0;--white:#fff;--line:#d9e2e7;--blue:#2878d0;--sky:#dff2ff;--green:#1b8a6b;--mint:#def6ec;--yellow:#ffd95a;--sun:#fff1b8;--coral:#f36f56;--rose:#ffe7e0;--purple:#7656c9;--shadow:0 14px 34px rgba(23,58,94,.12);--radius:22px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--text);font-family:ui-rounded,"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit}.skip{position:fixed;top:-80px;left:16px;z-index:100;padding:10px 14px;background:#fff;border:3px solid var(--ink);border-radius:10px}.skip:focus{top:16px}:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    .app{min-height:100vh;display:grid;grid-template-columns:270px 1fr}.side{height:100vh;position:sticky;top:0;overflow:auto;padding:22px 16px;background:var(--ink);color:#fff}.brand{display:flex;gap:12px;align-items:center;padding:4px 7px 20px;text-decoration:none}.brand-mark{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--yellow);color:var(--ink);font-size:27px;transform:rotate(-3deg)}.brand strong{display:block;line-height:1.15}.brand small{opacity:.8}.side h2{margin:19px 8px 7px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.65}.nav{display:grid;gap:5px}.nav button{min-height:46px;padding:9px 11px;border:0;border-radius:12px;background:transparent;color:#fff;text-align:left}.nav button:hover,.nav button.active{background:rgba(255,255,255,.14)}.nav button.active{box-shadow:inset 4px 0 var(--yellow)}.progress-box{margin-top:22px;padding:13px;border-radius:15px;background:rgba(255,255,255,.1)}.progress-row{display:flex;justify-content:space-between;font-size:12px}.track{height:9px;margin-top:8px;overflow:hidden;border-radius:10px;background:rgba(255,255,255,.18)}.track i{display:block;height:100%;width:0;background:var(--yellow);transition:width .3s}
    .main{min-width:0}.top{height:70px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,42px);border-bottom:1px solid var(--line);background:rgba(255,250,240,.94);backdrop-filter:blur(12px)}.menu{display:none}.top-title{font-weight:800;color:var(--ink)}.top-actions{display:flex;gap:8px}.icon-btn,.button{min-height:44px;border:0;border-radius:12px;font-weight:800}.icon-btn{min-width:44px;background:var(--white);border:1px solid var(--line)}.button{padding:10px 16px;background:var(--ink);color:#fff}.button:hover{transform:translateY(-1px)}.button.blue{background:var(--blue)}.button.green{background:var(--green)}.button.light{border:2px solid var(--ink);background:#fff;color:var(--ink)}.button.small{min-height:38px;padding:7px 11px;font-size:13px}.view{max-width:1120px;margin:auto;padding:clamp(25px,5vw,58px);outline:none}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}h1,h2,h3{color:var(--ink);line-height:1.16}h1{font-size:clamp(38px,6vw,72px);margin:.15em 0}h2{font-size:clamp(29px,4vw,45px)}h3{font-size:21px}.lead{max-width:740px;font-size:clamp(18px,2.2vw,23px);color:#41536a}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:center}.hero-visual{min-height:350px;display:grid;place-items:center;position:relative;border-radius:34px;background:var(--sky);box-shadow:var(--shadow);overflow:hidden}.hero-visual .big{font-size:120px}.orbit{position:absolute;width:260px;height:260px;border:3px dashed rgba(23,58,94,.25);border-radius:50%;animation:spin 18s linear infinite}.orbit span{position:absolute;padding:8px;border-radius:50%;background:#fff;font-size:25px}.orbit span:nth-child(1){top:-15px;left:105px}.orbit span:nth-child(2){right:-12px;top:105px}.orbit span:nth-child(3){bottom:-15px;left:105px}.orbit span:nth-child(4){left:-12px;top:105px}@keyframes spin{to{transform:rotate(360deg)}}.hero-actions{display:flex;gap:10px;flex-wrap:wrap}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:30px 0}.fact{padding:15px;border:1px solid var(--line);border-radius:16px;background:#fff}.fact strong{display:block;color:var(--ink);font-size:28px}.fact span{font-size:12px;color:#5a6a7e}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:38px 0 17px}.section-head h2{margin:0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{padding:22px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:0 8px 20px rgba(23,58,94,.06)}.card:nth-child(4n+1){background:var(--sky)}.card:nth-child(4n+2){background:var(--sun)}.card:nth-child(4n+3){background:var(--mint)}.card:nth-child(4n){background:var(--rose)}.card-icon{font-size:35px}.card h3{margin:8px 0}.card p{min-height:54px}.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.status{font-size:12px;font-weight:800;color:#54657b}.status.done{color:var(--green)}
    .module-head{padding:24px;border-radius:28px;background:var(--sky);box-shadow:var(--shadow)}.module-number{font-size:70px;font-weight:900;color:rgba(23,58,94,.12);float:right}.module-tools{display:flex;gap:8px;flex-wrap:wrap}.warm,.activity,.challenge,.note-card,.adult-card{margin:22px 0;padding:22px;border-radius:var(--radius);border:1px solid var(--line);background:#fff}.warm{border:3px solid var(--yellow);background:#fffdf2}.warm-options,.challenge-options{display:grid;gap:8px}.choice{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:13px;background:#fff;text-align:left;color:var(--text)}.choice:hover{border-color:var(--blue)}.choice.correct{border-color:var(--green);background:var(--mint)}.choice.wrong{border-color:var(--coral);background:var(--rose)}.feedback{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--ink);color:#fff}.lesson{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:24px;margin-top:24px}.lesson article{padding:6px}.lesson article>p,.lesson article>ul{font-size:18px}.lesson article h3{margin-top:30px}.side-tip{align-self:start;position:sticky;top:90px;padding:18px;border-radius:18px;background:var(--sun)}.example{margin:20px 0;padding:18px;border-left:6px solid var(--blue);border-radius:12px;background:var(--sky)}.activity{background:var(--mint)}.activity textarea,.notes-form textarea{width:100%;min-height:100px;padding:12px;border:2px solid var(--line);border-radius:12px;resize:vertical;background:#fff}.challenge{background:#f5f1ff}.challenge fieldset{margin:18px 0;padding:16px;border:1px solid #d9cff5;border-radius:14px}.challenge label{display:flex;gap:8px;padding:7px;border-radius:9px}.challenge label.correct{background:var(--mint)}.challenge label.wrong{background:var(--rose)}.challenge-result{font-size:18px;font-weight:900}.module-footer{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
    .labs{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.lab{padding:22px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}.lab.active{border:3px solid var(--green)}.lab-panel{margin-bottom:25px;padding:clamp(20px,4vw,35px);border-radius:28px;background:#fff;box-shadow:var(--shadow)}.lab-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}.controls label{display:block;margin:14px 0 5px;font-weight:900}.controls input[type=range]{width:100%;accent-color:var(--blue)}.ball-bag{min-height:270px;padding:24px;display:flex;align-content:flex-start;justify-content:center;flex-wrap:wrap;gap:8px;border:4px solid var(--ink);border-top:0;border-radius:0 0 35px 35px;background:#f6fbff}.ball{width:38px;height:38px;border-radius:50%;box-shadow:inset -5px -5px 8px rgba(0,0,0,.13)}.ball.red{background:var(--coral)}.ball.blue{background:var(--blue)}.result-box{padding:15px;border-radius:14px;background:var(--sun);font-weight:800}.cause-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.graph{height:320px;display:flex;align-items:end;justify-content:center;gap:42px;padding:20px 20px 60px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink)}.graph-bar{width:80px;position:relative;border-radius:8px 8px 0 0;background:var(--blue);transition:height .3s}.graph-bar.coral{background:var(--coral)}.graph-bar span{position:absolute;width:120px;bottom:-50px;left:50%;transform:translateX(-50%);text-align:center;font-size:12px}.seed-table{display:grid;grid-template-columns:1fr 1fr;gap:12px}.seed-pot{padding:20px;border-radius:18px;background:var(--mint);text-align:center}.seed-pot .plant{font-size:55px}
    .notes-explain{padding:18px;border-left:6px solid var(--yellow);border-radius:13px;background:var(--sun)}.notes-layout{display:grid;grid-template-columns:340px 1fr;gap:20px}.notes-form,.notes-list{padding:20px;border:1px solid var(--line);border-radius:20px;background:#fff}.notes-list{display:grid;gap:10px}.note{padding:14px;border-radius:13px;background:var(--sky)}.note small{font-weight:900;color:var(--blue)}.glossary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.term{padding:17px;border:1px solid var(--line);border-radius:16px;background:#fff}.term h3{margin:0 0 4px}.adult-card{font-size:17px}.toast{position:fixed;left:50%;bottom:20px;z-index:80;transform:translate(-50%,100px);padding:11px 17px;border-radius:12px;background:var(--ink);color:#fff;opacity:0;transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}
    @media(max-width:900px){.app{grid-template-columns:1fr}.side{width:290px;position:fixed;left:-310px;z-index:50;box-shadow:20px 0 50px rgba(0,0,0,.25);transition:left .25s}.side.open{left:0}.menu{display:inline-grid;place-items:center}.hero,.lesson,.lab-grid,.notes-layout{grid-template-columns:1fr}.side-tip{position:static}.facts{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:620px){.view{padding:24px 15px 60px}.hero-visual{min-height:260px}.hero-visual .big{font-size:85px}.orbit{width:195px;height:195px}.orbit span:nth-child(1),.orbit span:nth-child(3){left:75px}.orbit span:nth-child(2),.orbit span:nth-child(4){top:75px}.cards,.labs,.glossary{grid-template-columns:1fr}.cause-grid{grid-template-columns:1fr}.module-footer{flex-direction:column}.module-footer .button{width:100%}.top-title{font-size:13px}.module-number{font-size:45px}.facts{grid-template-columns:1fr 1fr}.fact strong{font-size:23px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
    @media print{.side,.top,.module-tools,.module-footer{display:none!important}.app{display:block}.view{max-width:none}}
  </style>
</head>

    </aside>
    <main class="main">
      <header class="top"><button class="icon-btn menu" id="menuButton" aria-label="Apri il menu" aria-expanded="false">☰</button><div class="top-title" id="topTitle">Inizio</div><div class="top-actions"><button class="icon-btn" id="randomButton" aria-label="Apri una domanda a sorpresa" title="Domanda a sorpresa">🎲</button></div></header>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
  (()=>{'use strict';
    const modules=[
      {icon:'❓',title:'Domande da esplorare',subtitle:'Trasformare una curiosità in una domanda che possiamo controllare.',warm:{q:'Quale domanda possiamo esplorare con un piccolo esperimento?',o:['Perché i gatti sono simpatici?','Una pianta cresce di più con 4 o 8 ore di luce?','Qual è il colore più bello?'],a:1,e:'Possiamo misurare la crescita e confrontare due quantità di luce.'},sections:[['La curiosità è il punto di partenza','Gli scienziati non sanno già tutto. Cominciano da una cosa che li sorprende e fanno una domanda. Una buona domanda non chiede soltanto “perché?”. Dice che cosa vogliamo osservare o confrontare.'],['Rendi la domanda precisa','“Le piante amano la luce?” è interessante, ma vaga. “Due piantine uguali crescono allo stesso modo con quantità diverse di luce?” ci dice che cosa confrontare.'],['Fai una previsione','Prima di guardare il risultato, prova a dire che cosa ti aspetti e perché. Una previsione non è una magia: è un’idea che può risultare giusta oppure sbagliata.']],example:'Curiosità: il ghiaccio si scioglie più in fretta al sole? Domanda: due cubetti uguali, uno al sole e uno all’ombra, quanto tempo impiegano a sciogliersi?',activity:'Scrivi una domanda su qualcosa che puoi osservare a scuola o a casa.',challenge:[{q:'Vuoi sapere se il rumore rende difficile leggere. Qual è il confronto migliore?',o:['Leggere due testi simili, uno nel silenzio e uno con rumore','Chiedere a una persona se ama il silenzio','Leggere una sola volta'],a:0,e:'Il confronto cambia il rumore e mantiene simile il compito.'},{q:'Il risultato è diverso dalla tua previsione. Che cosa fai?',o:['Nascondi il risultato','Cambi i numeri','Controlli il procedimento e aggiorni l’idea'],a:2,e:'Una previsione sbagliata può insegnare molto.'}]},
      {icon:'👀',title:'Osservare con attenzione',subtitle:'Separare ciò che vediamo da ciò che immaginiamo.',warm:{q:'Trovi il cortile bagnato. Quale frase è un’osservazione?',o:['Ha piovuto','Il pavimento è bagnato','Qualcuno ha usato un tubo'],a:1,e:'“Bagnato” descrive ciò che vedi. Pioggia e tubo sono possibili spiegazioni.'},sections:[['Osservazione o spiegazione?','Osservare significa descrivere ciò che possiamo vedere, sentire o misurare. Spiegare significa proporre una causa. Le due cose sono entrambe utili, ma non sono uguali.'],['Usa misure chiare','“La matita è lunga” dipende dal confronto. “La matita è lunga 15 centimetri” permette a un’altra persona di controllare.'],['Scrivi come hai fatto','Se annoti luogo, momento, strumenti e passaggi, un compagno può ripetere l’osservazione. Questo si chiama protocollo.']],example:'Osservazione: ci sono 12 impronte sul terreno. Spiegazione possibile: è passato un cane. Potrebbe però essere stato un altro animale.',activity:'Guarda un oggetto vicino a te. Scrivi tre osservazioni e una possibile spiegazione.',challenge:[{q:'Quale frase contiene soltanto un’osservazione?',o:['La bevanda è fredda perché era in frigo','Il termometro segna 8 °C','La bevanda è la più buona'],a:1,e:'Il valore del termometro è controllabile.'},{q:'Due gruppi misurano lo stesso tavolo e ottengono valori diversi. Qual è il primo passo?',o:['Scegliere il numero più grande','Controllare strumenti e modo di misurare','Fare una media senza controllare'],a:1,e:'Prima bisogna capire se hanno misurato nello stesso modo.'}]},
      {icon:'⚖️',title:'Un confronto equo',subtitle:'Cambiare una cosa alla volta per capire che cosa conta.',warm:{q:'Vuoi confrontare due terricci. Quale prova è più equa?',o:['Piante diverse, vasi diversi e acqua diversa','Piante uguali, stessa acqua e luce, cambia solo il terriccio','Una pianta con terriccio e una senza acqua'],a:1,e:'Se cambia una sola cosa, è più facile capire che cosa ha prodotto la differenza.'},sections:[['Una cosa alla volta','In un confronto equo cambiamo la cosa che vogliamo studiare e cerchiamo di mantenere uguale il resto.'],['Serve un confronto','Se proviamo un nuovo fertilizzante su una sola pianta, non sappiamo come sarebbe cresciuta senza. Un secondo gruppo ci aiuta a confrontare.'],['Ripeti','Un solo risultato può dipendere dal caso. Ripetere con più semi o più volte rende il risultato più affidabile.']],example:'Per provare quale carta assorbe più acqua, usa fogli della stessa grandezza e la stessa quantità d’acqua.',activity:'Immagina un esperimento sui semi. Che cosa cambieresti? Che cosa manterresti uguale?',challenge:[{q:'Due barche di carta hanno forme diverse e usano anche carte diverse. Perché il test è difficile da capire?',o:['Cambiano due cose insieme','Le barche sono troppo piccole','Serve acqua colorata'],a:0,e:'Non sappiamo se conta la forma oppure la carta.'},{q:'Un seme germoglia e uno no. Quale miglioramento è più utile?',o:['Usare molti semi in ogni gruppo','Scegliere il risultato preferito','Cambiare tutte le condizioni'],a:0,e:'Più semi riducono il peso del caso.'}]},
      {icon:'🔗',title:'Insieme non vuol dire “per causa”',subtitle:'Cercare una terza spiegazione quando due cose cambiano insieme.',warm:{q:'Nei giorni caldi aumentano gelati e cappelli. Qual è una buona spiegazione?',o:['I gelati fanno comprare cappelli','I cappelli fanno mangiare gelati','Il caldo aumenta entrambe le cose'],a:2,e:'Il caldo è una terza cosa che può spiegare entrambe.'},sections:[['Due cose possono muoversi insieme','Quando A e B aumentano insieme, diciamo che sono associate. Ma questo non basta per dire che A causa B.'],['Cerca la terza cosa','Ombrelli e pozzanghere compaiono insieme. Gli ombrelli non creano le pozzanghere: la pioggia causa entrambe.'],['Pensa anche al verso opposto','Se chi legge molto conosce più parole, forse leggere aiuta. Ma è anche possibile che chi conosce più parole scelga di leggere di più. Servono altri controlli.']],example:'Più vigili del fuoco sono presenti, più l’incendio è grave. Non sono i vigili a rendere grave l’incendio: gli incendi grandi richiedono più vigili.',activity:'Trova due cose che accadono insieme. Scrivi almeno due spiegazioni possibili.',challenge:[{q:'Chi porta scarpe grandi legge meglio. Quale terza cosa spiega probabilmente il risultato?',o:['L’età: i bambini più grandi hanno piedi più grandi e leggono meglio','Le scarpe insegnano a leggere','I libri fanno crescere i piedi'],a:0,e:'L’età influenza sia la misura del piede sia la capacità di lettura.'},{q:'Dopo aver acceso la luce, senti un tuono. La luce ha causato il tuono?',o:['Sì, perché è avvenuto dopo','Non possiamo dirlo dalla sola sequenza','Sì, se la lampadina è grande'],a:1,e:'“Dopo” non significa automaticamente “a causa di”.'}]},
      {icon:'🔢',title:'Numeri con il denominatore',subtitle:'Capire “quanti su quanti” prima di confrontare.',warm:{q:'Quale gruppo ha la quota maggiore di risposte corrette?',o:['5 su 10','20 su 100','Sono uguali'],a:0,e:'5 su 10 è metà; 20 su 100 è un quinto.'},sections:[['Chiedi sempre “su quanti?”','Dire “5 bambini” non basta. Cinque su dieci è molto diverso da cinque su mille. Il numero totale si chiama denominatore.'],['Confronta parti uguali','Per confrontare gruppi di grandezza diversa, possiamo trasformare i risultati in frazioni o percentuali.'],['Guarda bene i grafici','Nei grafici a barre, una barra doppia dovrebbe rappresentare un valore doppio. Se l’asse non parte da zero, una piccola differenza può sembrare enorme.']],example:'Classe A: 12 su 20 vanno a piedi. Classe B: 15 su 30. Anche se 15 è maggiore di 12, la quota è maggiore nella classe A: 60% contro 50%.',activity:'Inventati due gruppi di grandezza diversa e confronta una quota.',challenge:[{q:'In A scelgono la mela 8 su 10; in B 12 su 20. Dove la mela è più scelta?',o:['A','B','Uguale'],a:0,e:'A è 80%; B è 60%.'},{q:'Un grafico a barre parte da 90 e mostra 95 e 100. Che cosa controlli?',o:['Se la scala amplifica la differenza','Se i colori sono belli','Se il titolo è corto'],a:0,e:'Una base tagliata può far sembrare enorme una differenza piccola.'}]},
      {icon:'🧠',title:'La mente prende scorciatoie',subtitle:'Rallentare quando la prima risposta sembra troppo facile.',warm:{q:'Credi che i cani piccoli abbaino di più. Quale informazione è più utile?',o:['Un video di un cane piccolo che abbaia','Dati su molti cani piccoli e grandi osservati nello stesso modo','Il racconto di un amico'],a:1,e:'Un confronto ampio evita di scegliere soltanto gli esempi che ricordiamo.'},sections:[['Cerchiamo conferme','La mente nota facilmente ciò che conferma un’idea e dimentica il resto. Si chiama bias di conferma.'],['Le storie restano in mente','Un caso emozionante può sembrarci più comune di quanto sia. Per capire quanto accade spesso servono tutti i casi, non soltanto quello famoso.'],['Rallenta','Chiediti: “Quale prova potrebbe mostrarmi che ho torto?”. È una domanda difficile e molto potente.']],example:'Se pensi che la fila scelta sia sempre la più lenta, ricorderai soprattutto le volte in cui hai aspettato. Per controllare dovresti annotare tutte le volte.',activity:'Scrivi una tua convinzione e una cosa che potrebbe farti cambiare idea.',challenge:[{q:'Hai indovinato tre previsioni e dimenticato sette errori. Qual è il problema?',o:['Stai contando solo i successi','Tre è un numero piccolo','Le previsioni non si possono controllare'],a:0,e:'Per valutarti servono successi ed errori.'},{q:'Una notizia conferma esattamente ciò che pensi. Che cosa fai?',o:['La condividi subito','Cerchi la fonte e una possibile prova contraria','La consideri vera perché ti piace'],a:1,e:'Una conferma piacevole merita lo stesso controllo delle altre notizie.'}]},
      {icon:'🕵️',title:'Notizie e intelligenza artificiale',subtitle:'Controllare prima di credere, usare o condividere.',warm:{q:'Un video dice: “Gli scienziati hanno scoperto che i compiti fanno male”. Che cosa controlli per prima?',o:['Quante faccine ha ricevuto','Chi ha fatto lo studio e che cosa ha misurato davvero','Se il video è divertente'],a:1,e:'Bisogna risalire alla fonte e capire che cosa è stato davvero osservato.'},sections:[['Trova la fonte','Un titolo racconta una versione molto corta. Cerca chi ha raccolto i dati, quando, su quante persone e con quale metodo.'],['Confronta','Una sola pagina può sbagliare. Controlla se fonti affidabili e indipendenti raccontano la stessa cosa. Chiedi aiuto a un adulto quando serve.'],['Anche l’AI può inventare','Un sistema di intelligenza artificiale può scrivere in modo sicuro anche quando sbaglia o inventa una fonte. Usalo per avere idee, non come prova finale.']],example:'Se l’AI cita un libro, controlla nel catalogo di una biblioteca o nel sito dell’editore che il libro esista e dica davvero quella cosa.',activity:'Scegli una notizia scientifica. Scrivi chi è la fonte originale e quale controllo faresti.',challenge:[{q:'Due siti copiano lo stesso errore. Sono due conferme indipendenti?',o:['Sì, perché sono due siti','No, se entrambi dipendono dalla stessa fonte','Sì, se hanno colori diversi'],a:1,e:'Contare copie della stessa fonte non aggiunge una nuova prova.'},{q:'L’AI ti dà una risposta perfetta ma senza fonte. Come la usi?',o:['Come risposta definitiva','Come idea da controllare','Non la leggi mai'],a:1,e:'Può essere un punto di partenza, non la verifica finale.'}]},
      {icon:'🌱',title:'Cambiare idea è una forza',subtitle:'Aggiornare le proprie idee quando arrivano nuove prove.',warm:{q:'Nuove osservazioni contraddicono la tua idea. Qual è il comportamento più scientifico?',o:['Ignorarle','Controllarle e, se sono solide, cambiare idea','Cambiare i dati'],a:1,e:'Cambiare idea davanti a buone prove è un segno di forza.'},sections:[['Non dobbiamo essere sicuri di tutto','Possiamo dire “non lo so ancora” oppure “penso che sia così, ma non ne sono certo”. La sicurezza dovrebbe crescere insieme alle prove.'],['Impara dagli errori','Un esperimento che non funziona non è sempre tempo perso. Può rivelare un problema nella domanda, nel metodo o nella nostra idea.'],['Sette piccole abitudini','Fai domande precise. Separa osservazioni e spiegazioni. Confronta in modo equo. Chiedi “su quanti?”. Cerca prove contrarie. Controlla le fonti. Aggiorna le idee.']],example:'Prima pensavi che tutte le piante avessero bisogno della stessa acqua. Dopo aver osservato cactus e felci, rendi la tua idea più precisa.',activity:'Completa la frase: “Prima pensavo…, poi ho osservato…, ora penso…”.',challenge:[{q:'Un compagno cambia idea dopo un esperimento ben fatto. Che cosa significa?',o:['È incoerente','Ha usato le nuove prove','Ha perso la discussione'],a:1,e:'Aggiornarsi è proprio ciò che dovrebbe fare un buon investigatore.'},{q:'Non hai abbastanza dati per decidere. Qual è una risposta corretta?',o:['Inventare una conclusione','Dire “non lo so ancora” e cercare altri dati','Scegliere l’idea più popolare'],a:1,e:'Riconoscere l’incertezza evita conclusioni premature.'}]}
    ];
    let questionIndex=0;
    for(const module of modules){
      for(const question of [module.warm,...module.challenge]){
        const correct=question.o[question.a];
        const others=question.o.filter((_,index)=>index!==question.a);
        const target=[1,0,2][questionIndex%3];
        others.splice(target,0,correct);
        question.o=others;
        question.a=target;
        questionIndex+=1;
      }
    }
    const labs=[
      {id:'seeds',icon:'🌱',title:'L’esperimento dei semi',desc:'Costruisci un confronto equo scegliendo che cosa cambiare.'},
      {id:'cause',icon:'🕵️',title:'Detective delle cause',desc:'Scopri la terza cosa nascosta dietro due eventi.'},
      {id:'chance',icon:'🔴',title:'Il sacchetto delle probabilità',desc:'Cambia le palline e prevedi che colore uscirà.'},
      {id:'graph',icon:'📊',title:'Il grafico elastico',desc:'Guarda come l’asse può cambiare l’impressione.'}
    ];
    const words=[['Osservazione','Descrizione di ciò che vediamo, sentiamo o misuriamo.'],['Spiegazione','Un’idea su come o perché qualcosa è accaduto.'],['Previsione','Ciò che pensiamo accadrà prima di vedere il risultato.'],['Esperimento','Prova organizzata per controllare una domanda.'],['Variabile','Qualcosa che può cambiare.'],['Confronto','Osservare somiglianze e differenze tra due o più situazioni.'],['Causa','Qualcosa che contribuisce a produrre un effetto.'],['Dato','Informazione raccolta con un’osservazione o una misura.'],['Denominatore','Il numero totale da cui provengono i casi contati.'],['Probabilità','Quanto è possibile che un evento accada.'],['Fonte','Il luogo o la persona da cui arriva un’informazione.'],['Incertezza','La parte che non conosciamo ancora con sicurezza.']];
    const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
    const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const state={read:new Set(JSON.parse(localStorage.getItem('pcs-kids-read')||'[]')),passed:new Set(JSON.parse(localStorage.getItem('pcs-kids-passed')||'[]')),notes:JSON.parse(localStorage.getItem('pcs-kids-notes')||'[]'),drafts:JSON.parse(localStorage.getItem('pcs-kids-drafts')||'{}')};
    function save(){localStorage.setItem('pcs-kids-read',JSON.stringify([...state.read]));localStorage.setItem('pcs-kids-passed',JSON.stringify([...state.passed]));localStorage.setItem('pcs-kids-notes',JSON.stringify(state.notes));localStorage.setItem('pcs-kids-drafts',JSON.stringify(state.drafts));updateProgress()}
    function toast(t){const n=$('#toast');n.textContent=t;n.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>n.classList.remove('show'),2200)}
    function route(){return(location.hash.slice(1)||'home').split('/')}
    function go(r){location.hash=r;$('#side').classList.remove('open');$('#menuButton').setAttribute('aria-expanded','false')}
    function nav(){const n=$('#moduleNav');n.innerHTML=modules.map((m,i)=>`<button data-route="module/${i+1}">${state.passed.has(i+1)?'✓':i+1} ${safe(m.title)}</button>`).join('');$$('[data-route]').forEach(b=>{b.classList.toggle('active',b.dataset.route===route().join('/'));b.toggleAttribute('aria-current',b.classList.contains('active'))})}
    function updateProgress(){const p=Math.round((state.read.size+state.passed.size)/(modules.length*2)*100);$('#progressText').textContent=p+'%';$('#progressBar').style.width=p+'%';nav()}
    function home(){return`<section class="hero"><div><div class="eyebrow">Per bambine e bambini curiosi · classi 3ª–5ª</div><h1>Fai domande.<br>Prova. Scopri.</h1><p class="lead">Otto tappe per osservare meglio, controllare le idee e non farsi ingannare dalla prima risposta.</p><div class="hero-actions"><button class="button blue" data-route="module/${modules.findIndex((_,i)=>!state.read.has(i+1))+1||1}">Comincia il viaggio →</button><button class="button light" data-route="labs">Apri i laboratori</button></div></div><div class="hero-visual"><div class="orbit"><span>🔎</span><span>🌱</span><span>📏</span><span>💡</span></div><div class="big">🧠</div></div></section><section class="facts"><div class="fact"><strong>8</strong><span>tappe brevi</span></div><div class="fact"><strong>4</strong><span>laboratori</span></div><div class="fact"><strong>10–15</strong><span>minuti per tappa</span></div><div class="fact"><strong>${state.passed.size}</strong><span>sfide superate</span></div></section><div class="section-head"><div><div class="eyebrow">La mappa</div><h2>Il viaggio delle domande</h2></div></div><section class="cards">${modules.map((m,i)=>moduleCard(m,i)).join('')}</section>`}
    function moduleCard(m,i){const done=state.passed.has(i+1);return`<article class="card"><div class="card-icon">${m.icon}</div><h3>${i+1}. ${safe(m.title)}</h3><p>${safe(m.subtitle)}</p><div class="card-foot"><span class="status ${done?'done':''}">${done?'✓ Sfida superata':state.read.has(i+1)?'Lettura completata':'Da esplorare'}</span><button class="button small" data-route="module/${i+1}">Apri</button></div></article>`}
    function moduleView(n){const m=modules[n-1],read=state.read.has(n),passed=state.passed.has(n);return`<header class="module-head"><span class="module-number">${n}</span><div class="eyebrow">Tappa ${n} di ${modules.length}</div><h2>${m.icon} ${safe(m.title)}</h2><p class="lead">${safe(m.subtitle)}</p><div class="module-tools"><button class="button light small" id="listenButton">🔊 Ascolta</button><span class="status ${read?'done':''}">${read?'✓ Letto':'○ Da leggere'}</span><span class="status ${passed?'done':''}">${passed?'✓ Sfida superata':'○ Sfida da fare'}</span></div></header><section class="warm"><div class="eyebrow">Prima idea</div><h3>${safe(m.warm.q)}</h3><div class="warm-options">${m.warm.o.map((o,i)=>`<button class="choice warm-choice" data-answer="${i}">${safe(o)}</button>`).join('')}</div><div class="warm-feedback" aria-live="polite"></div></section><div class="lesson"><article>${m.sections.map(s=>`<h3>${safe(s[0])}</h3><p>${safe(s[1])}</p>`).join('')}<div class="example"><strong>🔎 Esempio</strong><p>${safe(m.example)}</p></div><section class="activity"><h3>✏️ Tocca a te</h3><p>${safe(m.activity)}</p><textarea id="moduleDraft" placeholder="Scrivi qui…">${safe(state.drafts[n]||'')}</textarea><button class="button green" id="saveDraft">Salva nel taccuino</button></section>${challenge(m,n)}</article><aside class="side-tip"><strong>La domanda jolly</strong><p>Che cosa potrei osservare per capire se la mia idea è sbagliata?</p></aside></div><footer class="module-footer"><button class="button light" data-route="${n===1?'home':`module/${n-1}`}">← Prima</button><button class="button ${read?'green':'blue'}" id="markRead">${read?'✓ Lettura completata':'Segna come letto'}</button><button class="button" data-route="${n===modules.length?'labs':`module/${n+1}`}">Avanti →</button></footer>`}
    function challenge(m,n){return`<section class="challenge" id="challenge"><div class="eyebrow">Sfida finale</div><h3>Usa quello che hai imparato</h3><p>Non serve ricordare una frase: scegli che cosa faresti in una situazione nuova.</p>${m.challenge.map((q,qi)=>`<fieldset data-q="${qi}"><legend><strong>${qi+1}. ${safe(q.q)}</strong></legend><div class="challenge-options">${q.o.map((o,oi)=>`<label><input type="radio" name="c-${n}-${qi}" value="${oi}"><span>${safe(o)}</span></label>`).join('')}</div><div class="q-feedback" aria-live="polite"></div></fieldset>`).join('')}<button class="button blue" id="checkChallenge">Controlla le risposte</button><div class="challenge-result" aria-live="polite"></div></section>`}
    function labsHome(selected){const panel=selected?labPanel(selected):'';return`<div class="eyebrow">Impara facendo</div><h2>Laboratori</h2><p class="lead">Muovi i controlli, fai una scelta e guarda che cosa cambia.</p>${panel?`<section class="lab-panel">${panel}</section><h3>Scegli un altro laboratorio</h3>`:''}<section class="labs">${labs.map(l=>`<article class="lab ${selected===l.id?'active':''}"><div class="card-icon">${l.icon}</div><h3>${l.title}</h3><p>${l.desc}</p><button class="button ${selected===l.id?'green':''}" data-route="labs/${l.id}">${selected===l.id?'Aperto':'Apri'}</button></article>`).join('')}</section>`}
    function labPanel(id){if(id==='seeds')return`<div class="eyebrow">Confronto equo</div><h2>🌱 L’esperimento dei semi</h2><p>Scegli un disegno per capire se la luce cambia la crescita.</p><div class="seed-table"><div class="seed-pot"><div class="plant">🪴</div><strong>Gruppo A</strong><p id="seedA">6 ore di luce · 20 ml d’acqua</p></div><div class="seed-pot"><div class="plant">🌱</div><strong>Gruppo B</strong><p id="seedB">2 ore di luce · 20 ml d’acqua</p></div></div><div class="cause-grid"><button class="choice seed-choice" data-seed="fair">Stessi semi, vasi e acqua. Cambio solo la luce.</button><button class="choice seed-choice" data-seed="water">Cambio luce e quantità d’acqua.</button><button class="choice seed-choice" data-seed="plant">Uso semi di specie diverse.</button></div><div class="feedback" id="seedFeedback">Quale confronto permette di capire meglio l’effetto della luce?</div>`;if(id==='cause')return`<div class="eyebrow">Cerca la terza cosa</div><h2>🕵️ Detective delle cause</h2><p>Quando aumenta il numero di gelati venduti, aumentano anche le scottature al sole. Che cosa può spiegare entrambe?</p><div class="cause-grid"><button class="choice cause-choice" data-cause="0">🍦 I gelati causano scottature</button><button class="choice cause-choice" data-cause="1">☀️ Le giornate calde aumentano gelati e tempo al sole</button><button class="choice cause-choice" data-cause="2">🧴 La crema solare fa vendere gelati</button></div><div class="feedback" id="causeFeedback">Scegli la spiegazione più plausibile.</div>`;if(id==='chance')return`<div class="lab-grid"><div class="controls"><div class="eyebrow">Probabilità</div><h2>🔴 Il sacchetto delle probabilità</h2><label for="redBalls">Palline rosse: <strong id="redOutput">12</strong></label><input id="redBalls" type="range" min="0" max="20" value="12"><p id="chanceText" class="result-box"></p><button class="button blue" id="drawBall">Estrai una pallina</button><p id="drawResult" aria-live="polite"></p></div><div class="ball-bag" id="ballBag" aria-label="Sacchetto con palline rosse e blu"></div></div>`;return`<div class="lab-grid"><div class="controls"><div class="eyebrow">Grafici</div><h2>📊 Il grafico elastico</h2><p>Squadra A: 80 punti. Squadra B: 100 punti.</p><label for="graphStart">L’asse parte da: <strong id="graphOutput">0</strong></label><input id="graphStart" type="range" min="0" max="75" step="5" value="0"><p id="graphText" class="result-box"></p></div><div class="graph"><div class="graph-bar" id="gA"><span>Squadra A<br>80</span></div><div class="graph-bar coral" id="gB"><span>Squadra B<br>100</span></div></div></div>`}
    function notes(){return`<div class="eyebrow">Le tue idee</div><h2>✏️ Taccuino delle scoperte</h2><p class="lead">Serve per ricordare domande, osservazioni e cambiamenti di idea.</p><p class="notes-explain"><strong>Dove viene salvato?</strong> Soltanto in questo browser e su questo dispositivo. Non viene inviato al sito o a GitHub e non si trasferisce da solo su altri dispositivi. Può andare perso cancellando i dati del browser. Puoi esportarne una copia in formato testo.</p><div class="hero-actions"><button class="button light" id="exportNotes">Esporta il taccuino</button></div><div class="notes-layout"><section class="notes-form"><h3>Nuova scoperta</h3><select id="noteKind" aria-label="Tipo di nota"><option>Una domanda</option><option>Un’osservazione</option><option>Una prova contraria</option><option>Ho cambiato idea</option></select><textarea id="newNote" placeholder="Scrivi qui…"></textarea><button class="button blue" id="addNote">Salva</button></section><section class="notes-list"><h3>Ciò che hai salvato</h3>${state.notes.length?state.notes.slice().reverse().map(n=>`<article class="note"><small>${safe(n.kind)} · ${safe(n.date)}</small><p>${safe(n.text)}</p></article>`).join(''):'<p>Il taccuino è ancora vuoto.</p>'}</section></div>`}
    function glossary(){return`<div class="eyebrow">Piccolo dizionario</div><h2>🔤 Parole utili</h2><p class="lead">Parole semplici per raccontare come lavorano gli scienziati.</p><section class="glossary">${words.map(w=>`<article class="term"><h3>${w[0]}</h3><p>${w[1]}</p></article>`).join('')}</section>`}
    function adults(){return`<div class="eyebrow">Guida per insegnanti e famiglie</div><h2>👩‍🏫 Come usare il percorso</h2><section class="adult-card"><h3>Destinatari</h3><p>La versione è pensata soprattutto per le classi terza, quarta e quinta primaria. Ogni tappa richiede circa 10–15 minuti di lettura e attività.</p><h3>Obiettivi</h3><ul><li>Distinguere osservazione e spiegazione.</li><li>Formulare domande controllabili.</li><li>Progettare confronti equi.</li><li>Non confondere associazione e causa.</li><li>Leggere proporzioni e semplici grafici.</li><li>Controllare fonti e risposte dell’intelligenza artificiale.</li><li>Considerare normale cambiare idea davanti a nuove prove.</li></ul><h3>Uso consigliato</h3><p>Le domande iniziali non sono voti. Servono a far emergere l’intuizione. Dopo ogni scelta, chiedere al bambino di spiegare il proprio ragionamento. Nei laboratori è utile modificare una variabile alla volta e prevedere il risultato prima di muovere il controllo.</p><h3>Privacy</h3><p>Progressi e taccuino usano la memoria locale del browser. Nessun testo viene trasmesso. Su dispositivi condivisi, le note sono visibili a chi usa lo stesso browser.</p></section>`}
    function render(){const [r,v]=route();let html,title;if(r==='module'){const n=Math.min(8,Math.max(1,Number(v)||1));html=moduleView(n);title=`Tappa ${n} · ${modules[n-1].title}`}else if(r==='labs'){html=labsHome(v);title='Laboratori'}else if(r==='notes'){html=notes();title='Taccuino'}else if(r==='words'){html=glossary();title='Parole utili'}else if(r==='adults'){html=adults();title='Per gli adulti'}else{html=home();title='Inizio'}$('#view').innerHTML=html;$('#topTitle').textContent=title;document.title=title+' · Pensare come uno scienziato';bind(r,v);nav();window.scrollTo({top:0,behavior:'instant'});$('#view').focus({preventScroll:true})}
    function bind(r,v){if(r==='module'){const n=Number(v)||1,m=modules[n-1];$$('.warm-choice').forEach(b=>b.onclick=()=>{$$('.warm-choice').forEach((x,i)=>{x.disabled=true;x.classList.toggle('correct',i===m.warm.a)});if(Number(b.dataset.answer)!==m.warm.a)b.classList.add('wrong');$('.warm-feedback').innerHTML=`<div class="feedback">${safe(m.warm.e)}</div>`});$('#saveDraft').onclick=()=>{const t=$('#moduleDraft').value.trim();if(!t)return toast('Scrivi prima un’idea');state.drafts[n]=t;state.notes.push({kind:`Attività della tappa ${n}`,text:t,date:new Date().toLocaleDateString('it-IT')});save();toast('Salvato nel taccuino')};$('#markRead').onclick=()=>{state.read.add(n);save();toast('Lettura completata');render()};$('#checkChallenge').onclick=()=>{const fs=$$('#challenge fieldset'),answers=fs.map(f=>$('input:checked',f));if(answers.some(a=>!a))return toast('Rispondi a entrambe le situazioni');let score=0;fs.forEach((f,i)=>{const q=m.challenge[i],a=Number(answers[i].value),ok=a===q.a;if(ok)score++;$$('label',f).forEach((l,j)=>{l.classList.toggle('correct',j===q.a);l.classList.toggle('wrong',j===a&&!ok)});$('.q-feedback',f).innerHTML=`<p><strong>${ok?'Buona scelta.':'Riprova a pensarci.'}</strong> ${safe(q.e)}</p>`});if(score===2){state.passed.add(n);save()}$('.challenge-result').textContent=score===2?'⭐ 2 su 2: sfida superata!':`${score} su 2: leggi le spiegazioni e riprova.`};$('#listenButton').onclick=()=>{if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window))return toast('La lettura ad alta voce non è disponibile in questo browser');speechSynthesis.cancel();const text=[m.title,m.subtitle,...m.sections.flat(),m.example].join('. ');const u=new SpeechSynthesisUtterance(text);u.lang='it-IT';u.rate=.9;speechSynthesis.speak(u);toast('Lettura avviata')}}if(r==='labs'&&v)bindLab(v);if(r==='notes'){$('#addNote').onclick=()=>{const t=$('#newNote').value.trim();if(!t)return toast('Scrivi prima una nota');state.notes.push({kind:$('#noteKind').value,text:t,date:new Date().toLocaleDateString('it-IT')});save();toast('Nota salvata');render()};$('#exportNotes').onclick=()=>{const text=state.notes.map(n=>`${n.kind} · ${n.date}\n${n.text}`).join('\n\n---\n\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='taccuino-delle-scoperte.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}}}
    function bindLab(id){if(id==='seeds')$$('.seed-choice').forEach(b=>b.onclick=()=>{$$('.seed-choice').forEach(x=>x.classList.remove('correct','wrong'));const ok=b.dataset.seed==='fair';b.classList.add(ok?'correct':'wrong');$('#seedFeedback').textContent=ok?'Esatto: cambia soltanto la luce. Così il confronto è più equo.':'Qui cambiano più cose insieme: non sapremmo quale ha prodotto la differenza.'});if(id==='cause')$$('.cause-choice').forEach(b=>b.onclick=()=>{$$('.cause-choice').forEach(x=>x.classList.remove('correct','wrong'));const ok=b.dataset.cause==='1';b.classList.add(ok?'correct':'wrong');$('#causeFeedback').textContent=ok?'Ottimo: il caldo è una causa comune plausibile.':'Questa spiegazione è possibile da immaginare, ma non è la più plausibile. Cerca una terza cosa.'});if(id==='chance'){const update=()=>{const red=Number($('#redBalls').value),blue=20-red;$('#redOutput').textContent=red;$('#ballBag').innerHTML=`${'<i class="ball red"></i>'.repeat(red)}${'<i class="ball blue"></i>'.repeat(blue)}`;$('#chanceText').textContent=`Rosso: ${red} su 20 (${red*5}%). Blu: ${blue} su 20 (${blue*5}%).`};$('#redBalls').oninput=update;$('#drawBall').onclick=()=>{const red=Number($('#redBalls').value),draw=Math.random()*20<red?'rossa':'blu';$('#drawResult').textContent=`Hai estratto una pallina ${draw}. Una singola estrazione può sorprendere: prova più volte!`};update()}if(id==='graph'){const update=()=>{const start=Number($('#graphStart').value),scale=260/(110-start);$('#graphOutput').textContent=start;$('#gA').style.height=Math.max(10,(80-start)*scale)+'px';$('#gB').style.height=Math.max(10,(100-start)*scale)+'px';const ratio=(100-start)/(80-start);$('#graphText').textContent=`B ha il 25% di punti in più, ma con questo asse la sua barra sembra ${ratio.toLocaleString('it-IT',{maximumFractionDigits:1})} volte più alta.`};$('#graphStart').oninput=update;update()}}
    document.addEventListener('click',e=>{const b=e.target.closest('[data-route]');if(b){e.preventDefault();go(b.dataset.route)}});$('#menuButton').onclick=e=>{const open=$('#side').classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(open))};$('#randomButton').onclick=()=>go(`module/${1+Math.floor(Math.random()*8)}`);document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#side').classList.remove('open');$('#menuButton').setAttribute('aria-expanded','false')}});window.addEventListener('hashchange',render);updateProgress();render();
  })();
  </script>
